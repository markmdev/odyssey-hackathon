<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Odyssey Playground</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0a0a;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    video {
      flex: 1;
      min-height: 0;
      width: 100%;
      max-height: 70vh;
      object-fit: contain;
      background: #111;
    }
    .controls {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #151515;
      border-top: 1px solid #222;
    }
    .row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    input {
      flex: 1;
      padding: 10px 12px;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 6px;
      color: #e0e0e0;
      font-size: 14px;
      outline: none;
    }
    input:focus { border-color: #555; }
    input::placeholder { color: #666; }
    button {
      padding: 10px 18px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
    }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary { background: #2563eb; color: white; }
    .btn-primary:hover:not(:disabled) { background: #1d4ed8; }
    .btn-secondary { background: #333; color: #e0e0e0; }
    .btn-secondary:hover:not(:disabled) { background: #444; }
    .btn-danger { background: #dc2626; color: white; }
    .btn-danger:hover:not(:disabled) { background: #b91c1c; }
    #status {
      font-size: 12px;
      color: #888;
      padding: 0 2px;
    }
  </style>
</head>
<body>
  <video id="video" autoplay playsinline muted></video>
  <div class="controls">
    <div class="row">
      <input id="apiKey" type="password" placeholder="API key (ody_...)" />
      <button id="connectBtn" class="btn-primary">Connect</button>
      <button id="disconnectBtn" class="btn-danger" disabled>Disconnect</button>
    </div>
    <div class="row">
      <input id="prompt" placeholder="Describe a scene to generate..." />
      <button id="orientBtn" class="btn-secondary" disabled title="Toggle portrait/landscape">Portrait</button>
      <button id="startBtn" class="btn-primary" disabled>Start Stream</button>
      <button id="endBtn" class="btn-secondary" disabled>End</button>
    </div>
    <div class="row">
      <input id="interact" placeholder="Steer the scene midstream..." />
      <button id="interactBtn" class="btn-secondary" disabled>Send</button>
    </div>
    <div id="status">Disconnected</div>
  </div>
  <script type="module" src="/src/playground.ts"></script>
</body>
</html>
