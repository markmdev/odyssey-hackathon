<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Odyssey Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #000;
      color: #e0e0e0;
      height: 100vh;
      overflow: hidden;
    }

    /* -- Screens -- */
    .screen { display: none; height: 100vh; }
    .screen.active { display: flex; }

    /* -- Menu -- */
    #menu {
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
    }
    #menu h1 {
      font-size: 48px;
      font-weight: 700;
      letter-spacing: -1px;
    }
    #menu h1 span { color: #2563eb; }
    .scenarios {
      display: flex;
      gap: 12px;
    }
    .scenario-card {
      width: 220px;
      padding: 24px 20px;
      background: #151515;
      border: 2px solid #222;
      border-radius: 12px;
      cursor: pointer;
      text-align: center;
      transition: border-color 0.15s, background 0.15s;
    }
    .scenario-card:hover { border-color: #2563eb; background: #1a1a2e; }
    .scenario-card.selected { border-color: #2563eb; background: #1a1a2e; }
    .scenario-card h3 { font-size: 18px; margin-bottom: 6px; }
    .scenario-card p { font-size: 13px; color: #888; }
    #playBtn {
      padding: 14px 48px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
    }
    #playBtn:hover { background: #1d4ed8; }
    #playBtn:disabled { opacity: 0.4; cursor: not-allowed; }
    #menuStatus { font-size: 13px; color: #888; }

    /* -- Game -- */
    #game {
      position: relative;
      align-items: center;
      justify-content: center;
    }
    #game video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }
    .hud {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      pointer-events: none;
    }
    .keys {
      display: flex;
      gap: 4px;
    }
    .keys .key-row {
      display: flex;
      gap: 4px;
    }
    .key-grid {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .key {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      backdrop-filter: blur(8px);
      transition: background 0.1s, border-color 0.1s;
    }
    .key.active {
      background: rgba(37, 99, 235, 0.7);
      border-color: rgba(37, 99, 235, 0.9);
    }
    .key.wide { width: 104px; }
    .action-label {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.5);
      background: rgba(0, 0, 0, 0.5);
      padding: 4px 12px;
      border-radius: 4px;
      backdrop-filter: blur(8px);
    }
    #gameStatus {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 13px;
      color: rgba(255, 255, 255, 0.6);
      background: rgba(0, 0, 0, 0.5);
      padding: 6px 16px;
      border-radius: 6px;
      backdrop-filter: blur(8px);
    }
    #backBtn {
      position: absolute;
      top: 16px;
      left: 16px;
      padding: 6px 14px;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      color: rgba(255, 255, 255, 0.7);
      font-size: 13px;
      cursor: pointer;
      backdrop-filter: blur(8px);
    }
    #backBtn:hover { background: rgba(0, 0, 0, 0.7); }
  </style>
</head>
<body>
  <!-- Menu Screen -->
  <div id="menu" class="screen active">
    <h1>Odyssey <span>Engine</span></h1>
    <div class="scenarios" id="scenarios"></div>
    <button id="playBtn" disabled>Play</button>
    <div id="menuStatus">Connecting...</div>
  </div>

  <!-- Game Screen -->
  <div id="game" class="screen">
    <video id="video" autoplay playsinline muted></video>
    <button id="backBtn">← Menu</button>
    <div id="gameStatus"></div>
    <div class="hud">
      <div id="actionLabel" class="action-label"></div>
      <div class="key-grid">
        <div class="key-row">
          <div class="key" data-key="w">W</div>
        </div>
        <div class="key-row">
          <div class="key" data-key="a">A</div>
          <div class="key" data-key="s">S</div>
          <div class="key" data-key="d">D</div>
        </div>
        <div class="key-row">
          <div class="key wide" data-key=" ">SPACE</div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
